name: Update profile summary card

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light theme
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: VadymMazur
          THEME: github
          NAME: Vadym Mazur
          ANIMATION: none
          AUTO_PUSH: false

      - name: Generate dark theme
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: VadymMazur
          THEME: github_dark
          NAME: Vadym Mazur
          ANIMATION: none
          AUTO_PUSH: false

      - name: Validate and retain only the profile cards
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET

          output = Path('assets')
          output.mkdir(exist_ok=True)
          for theme, filename in [('github', 'github-stats-light.svg'), ('github_dark', 'github-stats-dark.svg')]:
              source = Path('profile-summary-card-output') / theme / '0-profile-details.svg'
              root = ET.parse(source).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', 'Expected an SVG card'
              text = ' '.join(root.itertext())
              assert 'Vadym Mazur' in text, 'Missing profile title'
              assert 'Contributions' in text, 'Missing contribution statistics'
              assert not any(el.tag.rsplit('}', 1)[-1] == 'script' for el in root.iter()), 'Unexpected script'
              shutil.copyfile(source, output / filename)

      - name: Commit updated cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/github-stats-light.svg assets/github-stats-dark.svg
          if git diff --cached --quiet; then
            echo 'Profile cards are already current.'
            exit 0
          fi
          git commit -m 'chore: refresh profile summary card'
          git pull --rebase origin main
          git push origin HEAD:main
